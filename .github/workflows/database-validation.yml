name: SocialOS database validation

on:
  push:
    branches:
      - integration/socialos-feature-stack
      - main
  pull_request:
    branches:
      - integration/socialos-feature-stack
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialos-db-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: Replay all database migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase start

      - name: Rebuild database from migration history
        run: supabase db reset

      - name: Verify migration ledger
        run: |
          supabase migration list
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 16

      - name: Verify schema and security invariants
        run: |
          supabase db query --local -f supabase/tests/migration_smoke.sql

      - name: Generate database types
        run: supabase gen types typescript --local > /tmp/socialos.types.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop
