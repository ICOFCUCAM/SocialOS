name: SocialOS CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "integration/**", "claude/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Formatting
        run: npm run format:check
      - name: Install publisher worker dependencies
        run: npm install --prefix workers/publisher --no-package-lock --no-audit --no-fund
      - name: Publisher worker syntax and tests
        run: |
          node --check workers/publisher/src/worker.mjs
          node --check workers/publisher/src/provider-rate-limits.mjs
          node --check workers/publisher/src/provider-quota-intelligence.mjs
          node --check workers/publisher/src/errors.mjs
          node --check workers/publisher/src/content-version.mjs
          node --check workers/publisher/src/provider-operation-state.mjs
          node --check workers/publisher/src/providers/meta.mjs
          node --check workers/publisher/src/providers/index.mjs
          node --check workers/analytics-collector/src/collector.mjs
          node --check workers/analytics-collector/src/meta-insights.mjs
          node --check workers/analytics-collector/src/linkedin-insights.mjs
          node --check workers/analytics-collector/src/oauth-token.mjs
          node --check workers/analytics-collector/src/provider-errors.mjs
          npm test --prefix workers/analytics-collector
          npm test --prefix workers/publisher
      - name: Media processor syntax and tests
        run: |
          node --check workers/media-processor/src/worker.mjs
          node --check workers/media-processor/src/scanner.mjs
          node --check workers/media-processor/src/rendition-profiles.mjs
          npm test --prefix workers/media-processor
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
